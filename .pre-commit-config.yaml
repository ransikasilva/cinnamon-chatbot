default_stages: [commit, manual, push]
exclude: '^$|.git_commit_template'
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v2.2.3
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-json # Checks json file
          - id: check-added-large-files
            exclude: "^docs/"
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: debug-statements # `breakpoint()` calls
          - id: requirements-txt-fixer
          # - id: flake8

    # - repo: https://github.com/pre-commit/mirrors-mypy
    #   rev: v0.720
    #   hooks:
    #       - id: mypy
    #         args: [--allow-redefinition, --ignore-missing-imports]
    #         exclude: |
    #             (?x)(
    #               ^octave_retail_analytics/templates/|
    #               ^docs/
    #             )

    - repo: local
      hooks:
          - id: isort
            name: "Sort imports"
            language: system
            types: [file, python]
            entry: isort
            stages: [commit, manual]
          - id: black
            name: "Black"
            language: system
            pass_filenames: false
            entry: black src
            stages: [commit, manual]
            args: [--exclude=src/pipeline/0.1_utilities.py]
          - id: python-bandit-vulnerability-check
            name: "Bandit vulnerability check"
            entry: bandit
            args: [-lll, --recursive, .]
            language: system
            files: ''
            stages: [commit, manual]
          - id: license-check
            name: "License checker"
            language: system
            entry: make licensecheck
            stages: [commit, manual]

